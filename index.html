<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Документооборот МВД</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ВЕРХНЯЯ ПАНЕЛЬ */
  .topbar {
    background: #16162a;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #2a2a4a;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .burger-btn {
    background: #1e1e3a;
    border: 1px solid #2a2a4a;
    color: #f0c040;
    font-size: 20px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .burger-btn:hover { background: #2a2a4a; }
  .topbar .title {
    font-size: 15px;
    color: #f0c040;
    font-weight: 600;
  }
  .topbar .doc-name {
    font-size: 13px;
    color: #888;
    margin-left: auto;
  }

  /* ВЫПАДАЮЩЕЕ МЕНЮ */
  .dropdown {
    position: absolute;
    top: 60px;
    left: 20px;
    background: #16162a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    min-width: 280px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    z-index: 200;
    display: none;
    overflow: hidden;
    max-height: 80vh;
    overflow-y: auto;
  }
  .dropdown.open { display: block; }
  .dropdown .section-label {
    padding: 12px 18px 6px;
    font-size: 11px;
    color: #5a5a8a;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    background: #1a1a30;
  }
  .dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 18px;
    background: none;
    border: none;
    color: #b0b0c0;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .dropdown button:hover {
    background: #1e1e3a;
    color: #fff;
  }
  .dropdown button.active {
    background: #1e1e3a;
    color: #f0c040;
    border-left-color: #f0c040;
    font-weight: 500;
  }

  /* ОСНОВНАЯ ЧАСТЬ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ФОРМА СПРАВА */
  .form-panel {
    background: #16162a;
    padding: 24px 32px;
    overflow-y: auto;
    max-height: 45vh;
    border-bottom: 1px solid #2a2a4a;
  }
  .form-panel h2 {
    font-size: 16px;
    color: #f0c040;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label {
    font-size: 11px;
    color: #7a7a9a;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .form-group input, .form-group textarea {
    padding: 9px 12px;
    font-size: 13px;
    border: 1px solid #2a2a4a;
    background: #0f0f1a;
    color: #e0e0e0;
    border-radius: 6px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: #f0c040;
  }
  .form-group textarea { resize: vertical; min-height: 70px; }

  /* ПРЕДПРОСМОТР */
  .preview-panel {
    flex: 1;
    padding: 32px;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    background: #0a0a14;
  }
  .document {
    background: #fff;
    width: 210mm;
    min-height: 297mm;
    padding: 20mm 18mm;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    font-family: 'Times New Roman', 'Georgia', serif;
    font-size: 12pt;
    line-height: 1.6;
    color: #000;
    border-radius: 2px;
  }
  .document h2 {
    text-align: center;
    font-size: 15pt;
    font-weight: bold;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .document .subtitle {
    text-align: center;
    font-size: 11pt;
    margin-bottom: 24px;
    color: #333;
  }
  .document .field {
    border-bottom: 1px solid #000;
    display: inline-block;
    min-width: 80px;
    padding: 0 4px;
    min-height: 1.2em;
  }
  .document .line { margin: 8px 0; }
  .document .section-title {
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 8px;
    font-size: 12pt;
  }
  .document .indent { text-indent: 32px; }
  .document .signature {
    text-align: right;
    margin-top: 40px;
  }
  .document .box {
    border: 1px solid #000;
    padding: 10px;
    min-height: 50px;
    margin: 8px 0;
    font-size: 11pt;
  }

  /* КНОПКИ */
  .actions {
    padding: 16px 32px;
    background: #16162a;
    display: flex;
    gap: 12px;
    border-top: 1px solid #2a2a4a;
  }
  .actions button {
    padding: 11px 24px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-print { background: #f0c040; color: #16162a; }
  .btn-print:hover { background: #e0b030; }
  .btn-clear { background: #2a2a4a; color: #b0b0c0; }
  .btn-clear:hover { background: #3a3a5a; color: #fff; }

  @media (max-width: 900px) {
    .form-panel { padding: 16px; max-height: none; }
    .preview-panel { padding: 12px; }
    .document { width: 100%; padding: 16px; font-size: 11pt; }
    .actions { padding: 12px 16px; }
    .actions button { flex: 1; padding: 10px; font-size: 13px; }
    .dropdown { left: 10px; right: 10px; min-width: auto; }
  }

  @media print {
    body { background: #fff; display: block; }
    .topbar, .form-panel, .actions, .dropdown { display: none !important; }
    .preview-panel { padding: 0; display: block; overflow: visible; }
    .document { box-shadow: none; width: auto; min-height: auto; padding: 15mm; border-radius: 0; }
  }
</style>
</head>
<body>

<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<div class="topbar">
  <button class="burger-btn" onclick="toggleMenu(event)">☰</button>
  <div class="title">📋 Документооборот МВД</div>
  <div class="doc-name" id="currentDocName">Бортовой журнал</div>
</div>

<!-- ВЫПАДАЮЩЕЕ МЕНЮ -->
<div class="dropdown" id="dropdown">
  <div class="section-label">ППСП</div>
  <button class="nav-btn active" data-doc="pps-journal" onclick="switchDoc('pps-journal')">Бортовой журнал</button>
  <button class="nav-btn" data-doc="pps-admin" onclick="switchDoc('pps-admin')">Протокол задержания</button>
  <button class="nav-btn" data-doc="pps-search" onclick="switchDoc('pps-search')">Протокол досмотра</button>
  <button class="nav-btn" data-doc="pps-seize" onclick="switchDoc('pps-seize')">Протокол изъятия</button>

  <div class="section-label">ДПС</div>
  <button class="nav-btn" data-doc="dps-offense" onclick="switchDoc('dps-offense')">Протокол об АП</button>
  <button class="nav-btn" data-doc="dps-scheme" onclick="switchDoc('dps-scheme')">Схема места АП</button>
  <button class="nav-btn" data-doc="dps-remove" onclick="switchDoc('dps-remove')">Отстранение от ТС</button>

  <div class="section-label">ОУР</div>
  <button class="nav-btn" data-doc="our-wanted" onclick="switchDoc('our-wanted')">Разыскная ориентировка</button>
  <button class="nav-btn" data-doc="our-report" onclick="switchDoc('our-report')">Рапорт о работе</button>
</div>

<!-- ОСНОВНАЯ ЧАСТЬ -->
<div class="main">
  <div class="form-panel" id="formPanel">
    <h2 id="formTitle">Заполнение</h2>
    <div class="form-grid" id="formGrid"></div>
  </div>

  <div class="preview-panel">
    <div class="document" id="docPreview"></div>
  </div>

  <div class="actions">
    <button class="btn-print" onclick="window.print()">🖨 Печать / Сохранить PDF</button>
    <button class="btn-clear" onclick="clearForm()">🗑 Очистить</button>
  </div>
</div>

<script>
const DOCS = {
  'pps-journal': {
    title: 'Бортовой журнал автопатруля',
    shortName: 'Бортовой журнал',
    fields: [
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time_start', label: 'Начало службы', type: 'time' },
      { id: 'time_end', label: 'Окончание', type: 'time' },
      { id: 'senior', label: 'Старший наряда', type: 'text', full: true },
      { id: 'officer', label: 'Полицейский', type: 'text', full: true },
      { id: 'driver', label: 'Полицейский-водитель', type: 'text', full: true },
      { id: 'car', label: 'Автомобиль', type: 'text' },
      { id: 'plate', label: 'Гос. номер', type: 'text' },
      { id: 'notes', label: 'Примечания', type: 'textarea', full: true }
    ],
    render: (d) => `
      <h2>Бортовой журнал автопатруля</h2>
      <div class="subtitle">Отдельная рота патрульно-постовой службы полиции</div>
      <div class="line">Начат: <span class="field">${d.time_start||'____'}</span> &nbsp;&nbsp; Окончен: <span class="field">${d.time_end||'____'}</span></div>
      <div class="line">«<span class="field">${d.date?d.date.split('-')[2]:'____'}</span>» <span class="field">${d.date?d.date.split('-')[1]:'______'}</span> <span class="field">${d.date?d.date.split('-')[0]:'____'}</span> г.</div>
      <div class="section-title">Наряд в составе:</div>
      <div class="line">Старший: <span class="field" style="min-width:300px;">${d.senior||'________________'}</span></div>
      <div class="line">Полицейский: <span class="field" style="min-width:300px;">${d.officer||'________________'}</span></div>
      <div class="line">Полицейский-водитель: <span class="field" style="min-width:300px;">${d.driver||'________________'}</span></div>
      <div class="line">Автомобиль: <span class="field" style="min-width:160px;">${d.car||'________'}</span>, знак: <span class="field" style="min-width:100px;">${d.plate||'______'}</span></div>
      <div class="section-title">Примечания:</div>
      <div class="box">${(d.notes||'').replace(/\n/g,'<br>')||'&nbsp;'}</div>
    `
  },

  'pps-admin': {
    title: 'Протокол об административном задержании',
    shortName: 'Протокол задержания',
    fields: [
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time', label: 'Время', type: 'time' },
      { id: 'place', label: 'Место составления', type: 'text', full: true },
      { id: 'officer', label: 'Кто составил', type: 'text', full: true },
      { id: 'detainee', label: 'Задержанный (ФИО)', type: 'text', full: true },
      { id: 'birth', label: 'Дата и место рождения', type: 'text', full: true },
      { id: 'address', label: 'Место жительства', type: 'text', full: true },
      { id: 'reason', label: 'Основание задержания', type: 'textarea', full: true },
      { id: 'witnesses', label: 'Понятые', type: 'textarea', full: true }
    ],
    render: (d) => `
      <h2>ПРОТОКОЛ</h2>
      <div class="subtitle">об административном задержании</div>
      <div class="line">«<span class="field">${d.date?d.date.split('-')[2]:'____'}</span>» <span class="field">${d.date?d.date.split('-')[1]:'______'}</span> <span class="field">${d.date?d.date.split('-')[0]:'____'}</span> г. <span class="field">${d.time||'__:__'}</span></div>
      <div class="line">Место составления: <span class="field" style="min-width:300px;">${d.place||'________________'}</span></div>
      <div class="indent" style="margin-top:16px;">
        Я, <span class="field" style="min-width:300px;">${d.officer||'________________'}</span>, составил настоящий протокол об административном задержании гражданина(ки)
        <span class="field" style="min-width:250px;">${d.detainee||'________________'}</span>,
        <span class="field" style="min-width:200px;">${d.birth||'________________'}</span>,
        место жительства: <span class="field" style="min-width:250px;">${d.address||'________________'}</span>
      </div>
      <div class="section-title">Основание задержания:</div>
      <div class="box">${d.reason||'&nbsp;'}</div>
      <div class="section-title">Понятые:</div>
      <div class="box">${d.witnesses||'&nbsp;'}</div>
      <div class="signature">
        Подпись задержанного: _______________<br>
        Подпись составителя: _______________
      </div>
    `
  },

  'pps-search': {
    title: 'Протокол о личном досмотре',
    shortName: 'Протокол досмотра',
    fields: [
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time', label: 'Время', type: 'time' },
      { id: 'place', label: 'Место составления', type: 'text', full: true },
      { id: 'officer', label: 'Кто составил', type: 'text', full: true },
      { id: 'person', label: 'Досматриваемый (ФИО)', type: 'text', full: true },
      { id: 'address', label: 'Место жительства', type: 'text', full: true },
      { id: 'reason', label: 'Основание досмотра', type: 'textarea', full: true },
      { id: 'found', label: 'Обнаружено', type: 'textarea', full: true },
      { id: 'witnesses', label: 'Понятые', type: 'textarea', full: true }
    ],
    render: (d) => `
      <h2>ПРОТОКОЛ</h2>
      <div class="subtitle">о личном досмотре, досмотре вещей</div>
      <div class="line">«<span class="field">${d.date?d.date.split('-')[2]:'____'}</span>» <span class="field">${d.date?d.date.split('-')[1]:'______'}</span> <span class="field">${d.date?d.date.split('-')[0]:'____'}</span> г. <span class="field">${d.time||'__:__'}</span></div>
      <div class="line">Место: <span class="field" style="min-width:300px;">${d.place||'________________'}</span></div>
      <div class="indent" style="margin-top:16px;">
        Я, <span class="field" style="min-width:300px;">${d.officer||'________________'}</span>, осуществил личный досмотр гражданина(ки)
        <span class="field" style="min-width:250px;">${d.person||'________________'}</span>,
        проживающего(ей): <span class="field" style="min-width:250px;">${d.address||'________________'}</span>
      </div>
      <div class="section-title">Основание досмотра:</div>
      <div class="box">${d.reason||'&nbsp;'}</div>
      <div class="section-title">Обнаружено:</div>
      <div class="box">${d.found||'&nbsp;'}</div>
      <div class="section-title">Понятые:</div>
      <div class="box">${d.witnesses||'&nbsp;'}</div>
      <div class="signature">
        Подпись досматриваемого: _______________<br>
        Подпись составителя: _______________
      </div>
    `
  },

  'pps-seize': {
    title: 'Протокол об изъятии вещей и документов',
    shortName: 'Протокол изъятия',
    fields: [
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time', label: 'Время', type: 'time' },
      { id: 'place', label: 'Место составления', type: 'text', full: true },
      { id: 'officer', label: 'Кто составил', type: 'text', full: true },
      { id: 'person', label: 'У кого изъято (ФИО)', type: 'text', full: true },
      { id: 'items', label: 'Что изъято', type: 'textarea', full: true },
      { id: 'reason', label: 'Основание изъятия', type: 'textarea', full: true },
      { id: 'witnesses', label: 'Понятые', type: 'textarea', full: true }
    ],
    render: (d) => `
      <h2>ПРОТОКОЛ</h2>
      <div class="subtitle">об изъятии вещей и документов</div>
      <div class="line">«<span class="field">${d.date?d.date.split('-')[2]:'____'}</span>» <span class="field">${d.date?d.date.split('-')[1]:'______'}</span> <span class="field">${d.date?d.date.split('-')[0]:'____'}</span> г. <span class="field">${d.time||'__:__'}</span></div>
      <div class="line">Место: <span class="field" style="min-width:300px;">${d.place||'________________'}</span></div>
      <div class="indent" style="margin-top:16px;">
        Я, <span class="field" style="min-width:300px;">${d.officer||'________________'}</span>, составил настоящий протокол о том, что у гражданина(ки)
        <span class="field" style="min-width:250px;">${d.person||'________________'}</span>
      </div>
      <div class="section-title">Изъято:</div>
      <div class="box">${d.items||'&nbsp;'}</div>
      <div class="section-title">Основание:</div>
      <div class="box">${d.reason||'&nbsp;'}</div>
      <div class="section-title">Понятые:</div>
      <div class="box">${d.witnesses||'&nbsp;'}</div>
      <div class="signature">
        Подпись лица, у которого изъято: _______________<br>
        Подпись составителя: _______________
      </div>
    `
  },

  'dps-offense': {
    title: 'Протокол об административном правонарушении',
    shortName: 'Протокол об АП',
    fields: [
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time', label: 'Время', type: 'time' },
      { id: 'place', label: 'Место составления', type: 'text', full: true },
      { id: 'officer', label: 'Кто составил', type: 'text', full: true },
      { id: 'offender', label: 'Нарушитель (ФИО)', type: 'text', full: true },
      { id: 'address', label: 'Место жительства', type: 'text', full: true },
      { id: 'article', label: 'Статья КоАП', type: 'text' },
      { id: 'vehicle', label: 'ТС (марка, гос. номер)', type: 'text' },
      { id: 'desc', label: 'Суть нарушения', type: 'textarea', full: true },
      { id: 'witnesses', label: 'Свидетели', type: 'textarea', full: true }
    ],
    render: (d) => `
      <h2>ПРОТОКОЛ</h2>
      <div class="subtitle">об административном правонарушении</div>
      <div class="line">«<span class="field">${d.date?d.date.split('-')[2]:'____'}</span>» <span class="field">${d.date?d.date.split('-')[1]:'______'}</span> <span class="field">${d.date?d.date.split('-')[0]:'____'}</span> г. <span class="field">${d.time||'__:__'}</span></div>
      <div class="line">Место: <span class="field" style="min-width:300px;">${d.place||'________________'}</span></div>
      <div class="indent" style="margin-top:16px;">
        Я, <span class="field" style="min-width:300px;">${d.officer||'________________'}</span>, составил настоящий протокол о том, что гражданин(ка)
        <span class="field" style="min-width:250px;">${d.offender||'________________'}</span>,
        проживающий(ая): <span class="field" style="min-width:250px;">${d.address||'________________'}</span>
      </div>
      <div class="line" style="margin-top:10px;">
        управляя ТС: <span class="field" style="min-width:250px;">${d.vehicle||'________________'}</span>,
        совершил(а) нарушение по ст. <span class="field">${d.article||'____'}</span> КоАП РФ.
      </div>
      <div class="section-title">Суть нарушения:</div>
      <div class="box">${d.desc||'&nbsp;'}</div>
      <div class="section-title">Свидетели:</div>
      <div class="box">${d.witnesses||'&nbsp;'}</div>
      <div class="signature">
        Подпись нарушителя: _______________<br>
        Подпись составителя: _______________
      </div>
    `
  },

  'dps-scheme': {
    title: 'Схема места совершения АП',
    shortName: 'Схема места АП',
    fields: [
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time', label: 'Время', type: 'time' },
      { id: 'place', label: 'Место', type: 'text', full: true },
      { id: 'officer', label: 'Кто составил', type: 'text', full: true },
      { id: 'desc', label: 'Описание схемы', type: 'textarea', full: true },
      { id: 'witnesses', label: 'Понятые', type: 'textarea', full: true }
    ],
    render: (d) => `

let currentDoc = 'pps-journal';

function toggleMenu(e) {
  e.stopPropagation();
  document.getElementById('dropdown').classList.toggle('open');
}

document.addEventListener('click', (e) => {
  const dd = document.getElementById('dropdown');
  const btn = document.querySelector('.burger-btn');
  if (!dd.contains(e.target) && e.target !== btn) {
    dd.classList.remove('open');
  }
});

function switchDoc(id) {
  currentDoc = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-doc="${id}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('currentDocName').textContent = DOCS[id].shortName || DOCS[id].title;
  document.getElementById('dropdown').classList.remove('open');
  renderForm();
  renderPreview();
}

function renderForm() {
  const doc = DOCS[currentDoc];
  document.getElementById('formTitle').textContent = doc.title;
  const grid = document.getElementById('formGrid');
  grid.innerHTML = '';

  doc.fields.forEach(f => {
    const div = document.createElement('div');
    div.className = 'form-group' + (f.full ? ' full' : '');
    div.innerHTML = `
      <label>${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea id="f_${f.id}" oninput="renderPreview()"></textarea>`
        : `<input type="${f.type}" id="f_${f.id}" oninput="renderPreview()">`}
    `;
    grid.appendChild(div);
  });

  const saved = localStorage.getItem('doc_' + currentDoc);
  if (saved) {
    const data = JSON.parse(saved);
    doc.fields.forEach(f => {
      const el = document.getElementById('f_' + f.id);
      if (el && data[f.id]) el.value = data[f.id];
    });
  }
}

function renderPreview() {
  const doc = DOCS[currentDoc];
  const data = {};
  doc.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if (el) data[f.id] = el.value;
  });
  localStorage.setItem('doc_' + currentDoc, JSON.stringify(data));
  document.getElementById('docPreview').innerHTML = doc.render(data);
}

function clearForm() {
  if (!confirm('Очистить форму?')) return;
  const doc = DOCS[currentDoc];
  doc.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if (el) el.value = '';
  });
  localStorage.removeItem('doc_' + currentDoc);
  renderPreview();
}

renderForm();
renderPreview();
</script>
