<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Документооборот МВД</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0f1a; color: #e0e0e0;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .topbar {
    background: #16162a; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid #2a2a4a;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar .title { font-size: 15px; color: #f0c040; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .topbar .doc-name { font-size: 13px; color: #888; margin-right: 10px; }
  .burger-btn {
    background: #1e1e3a; border: 1px solid #2a2a4a; color: #f0c040;
    font-size: 20px; padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-family: inherit;
  }
  .burger-btn:hover { background: #2a2a4a; }

  .dropdown {
    position: absolute; top: 60px; right: 20px;
    background: #16162a; border: 1px solid #2a2a4a;
    border-radius: 8px; min-width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 200;
    display: none; max-height: 80vh; overflow-y: auto;
  }
  .dropdown.open { display: block; }
  .dropdown .section-label {
    padding: 12px 18px 6px; font-size: 11px; color: #5a5a8a;
    text-transform: uppercase; letter-spacing: 1.5px;
    font-weight: 600; background: #1a1a30;
  }
  .dropdown button {
    display: block; width: 100%; text-align: left;
    padding: 11px 18px; background: none; border: none;
    color: #b0b0c0; font-size: 14px; cursor: pointer;
    font-family: inherit; border-right: 3px solid transparent;
  }
  .dropdown button:hover { background: #1e1e3a; color: #fff; }
  .dropdown button.active {
    background: #1e1e3a; color: #f0c040;
    border-right-color: #f0c040; font-weight: 500;
  }

  .page { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .page.active { display: flex; }

  .form-container { flex: 1; padding: 24px 32px; overflow-y: auto; }
  .form-container h2 { font-size: 16px; color: #f0c040; margin-bottom: 20px; font-weight: 600; }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label {
    font-size: 11px; color: #7a7a9a; margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  .form-group input, .form-group textarea, .form-group select {
    padding: 9px 12px; font-size: 13px; border: 1px solid #2a2a4a;
    background: #0f0f1a; color: #e0e0e0; border-radius: 6px;
    font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #f0c040; }
  .form-group textarea { resize: vertical; min-height: 70px; }

  .photo-block { margin-top: 24px; border-top: 1px solid #2a2a4a; padding-top: 16px; }
  .photo-block h3 { font-size: 13px; color: #f0c040; margin-bottom: 10px; }
  .photo-upload-btn {
    display: inline-block; padding: 10px 20px; background: #1e1e3a;
    border: 1px dashed #4a4a6a; border-radius: 6px; color: #b0b0c0;
    cursor: pointer; font-size: 13px;
  }
  .photo-upload-btn:hover { border-color: #f0c040; color: #f0c040; }
  .photo-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .photo-item {
    position: relative; width: 90px; height: 90px;
    border-radius: 6px; overflow: hidden; border: 1px solid #2a2a4a;
  }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; }
  .photo-item .remove {
    position: absolute; top: 2px; right: 2px;
    background: rgba(200,50,50,0.9); color: #fff;
    border: none; border-radius: 4px; width: 20px; height: 20px;
    cursor: pointer; font-size: 12px; line-height: 1;
  }

  .doc-container {
    flex: 1; padding: 24px; overflow-y: auto;
    display: flex; justify-content: center; background: #0a0a14;
  }
  .document {
    background: #fff; width: 210mm; min-height: 297mm;
    padding: 20mm 18mm; box-shadow: 0 0 40px rgba(0,0,0,0.5);
    font-family: 'Times New Roman', 'Georgia', serif;
    font-size: 12pt; line-height: 1.6; color: #000;
  }
  .document h2 {
    text-align: center; font-size: 15pt; font-weight: bold;
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;
  }
  .document .subtitle { text-align: center; font-size: 11pt; margin-bottom: 24px; color: #333; }
  .document .field {
    border-bottom: 1px solid #000; display: inline-block;
    min-width: 80px; padding: 0 4px; min-height: 1.2em;
  }
  .document .line { margin: 8px 0; }
  .document .section-title { font-weight: bold; margin-top: 18px; margin-bottom: 8px; font-size: 12pt; text-align: center; }
  .document .indent { text-indent: 32px; }
  .document .signature { text-align: right; margin-top: 40px; }
  .document .box {
    border: 1px solid #000; padding: 10px; min-height: 50px;
    margin: 8px 0; font-size: 11pt;
  }
  .document .header-mvd {
    text-align: center; font-weight: bold; font-size: 11pt;
    margin-bottom: 4px;
  }
  .document .ping-block {
    margin-top: 20px; font-size: 11pt;
  }
  .document .ping-block .ping-line { margin: 4px 0; }
  
  .su-line { border-bottom: 1px solid #000; display: inline-block; min-width: 60px; }
  .su-full-line { border-bottom: 1px solid #000; display: block; width: 100%; height: 1.2em; margin: 4px 0; }

  .actions {
    padding: 14px 24px; background: #16162a;
    display: flex; gap: 10px; border-top: 1px solid #2a2a4a;
    flex-wrap: wrap; justify-content: center;
  }
  .actions button {
    padding: 11px 22px; font-size: 14px; border: none;
    border-radius: 6px; cursor: pointer; font-weight: 600;
    font-family: inherit; transition: all 0.15s;
  }
  .btn-next { background: #f0c040; color: #16162a; }
  .btn-next:hover { background: #e0b030; }
  .btn-back { background: #2a2a4a; color: #b0b0c0; }
  .btn-back:hover { background: #3a3a5a; color: #fff; }
  .btn-print { background: #4a90e2; color: #fff; }
  .btn-print:hover { background: #3a80d2; }
  .btn-discord { background: #5865f2; color: #fff; }
  .btn-discord:hover { background: #4752c4; }
  .btn-discord:disabled { background: #3a3a5a; cursor: not-allowed; }
  .btn-clear { background: #2a2a4a; color: #b0b0c0; }
  .btn-clear:hover { background: #3a3a5a; color: #fff; }

  @media (max-width: 900px) {
    .form-container { padding: 16px; }
    .doc-container { padding: 12px; }
    .document { width: 100%; padding: 16px; font-size: 11pt; }
    .actions { padding: 10px; }
    .actions button { flex: 1; padding: 10px; font-size: 13px; }
    .dropdown { left: 10px; right: 10px; min-width: auto; }
  }

  @media print {
    body { background: #fff; display: block; }
    .topbar, .actions, .dropdown { display: none !important; }
    .page { display: none !important; }
    #page-doc, #page-gosznak { display: block !important; }
    .doc-container { padding: 0; overflow: visible; display: block; }
    .document { box-shadow: none; width: auto; min-height: auto; padding: 15mm; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">📋 Документооборот МВД</div>
  <div class="spacer"></div>
  <div class="doc-name" id="currentDocName">Бортовой журнал</div>
  <button class="burger-btn" onclick="toggleMenu(event)">☰</button>
</div>

<div class="dropdown" id="dropdown">
  <div class="section-label">СУ (Следствие)</div>
  <button class="nav-btn" data-doc="su-arrest" onclick="switchDoc('su-arrest')">Постановление о возбуждении УД</button>
  <button class="nav-btn" data-doc="su-search" onclick="switchDoc('su-search')">Протокол осмотра места</button>

  <div class="section-label">ПДН</div>
  <button class="nav-btn" data-doc="pdn-register" onclick="switchDoc('pdn-register')">Постановка на учёт</button>

  <div class="section-label">ППСП</div>
  <button class="nav-btn active" data-doc="pps-journal" onclick="switchDoc('pps-journal')">Бортовой журнал</button>
  <button class="nav-btn" data-doc="pps-admin" onclick="switchDoc('pps-admin')">Протокол задержания</button>
  <button class="nav-btn" data-doc="pps-search" onclick="switchDoc('pps-search')">Протокол досмотра</button>
  <button class="nav-btn" data-doc="pps-seize" onclick="switchDoc('pps-seize')">Протокол изъятия</button>

  <div class="section-label">ДПС</div>
  <button class="nav-btn" data-doc="dps-offense" onclick="switchDoc('dps-offense')">Протокол об АП</button>
  <button class="nav-btn" data-doc="dps-scheme" onclick="switchDoc('dps-scheme')">Схема места АП</button>
  <button class="nav-btn" data-doc="dps-remove" onclick="switchDoc('dps-remove')">Отстранение от ТС</button>

  <div class="section-label">ОУР</div>
  <button class="nav-btn" data-doc="our-wanted" onclick="switchDoc('our-wanted')">Разыскная ориентировка</button>
  <button class="nav-btn" data-doc="our-report" onclick="switchDoc('our-report')">Рапорт о работе</button>
  <button class="nav-btn" data-doc="our-rap" onclick="switchDoc('our-rap')">Рапорт о преступлении</button>

  <div class="section-label">ОУР — дополнительные</div>
  <button class="nav-btn" data-doc="our-detain" onclick="switchDoc('our-detain')">Протокол задержания</button>
  <button class="nav-btn" data-doc="our-orm" onclick="switchDoc('our-orm')">Рапорт о проведении ОРМ</button>
  <button class="nav-btn" data-doc="our-explain" onclick="switchDoc('our-explain')">Объяснительная</button>
  <button class="nav-btn" data-doc="our-request" onclick="switchDoc('our-request')">Служебный запрос</button>
  <button class="nav-btn" data-doc="our-weapon" onclick="switchDoc('our-weapon')">Рапорт о закреплении оружия</button>

  <div class="section-label">Рапорты</div>
  <button class="nav-btn" data-doc="rap-dismiss" onclick="switchDoc('rap-dismiss')">На увольнение</button>
  <button class="nav-btn" data-doc="rap-vacation" onclick="switchDoc('rap-vacation')">На отпуск</button>
  <button class="nav-btn" data-doc="rap-promote" onclick="switchDoc('rap-promote')">На повышение</button>
  <button class="nav-btn" data-doc="rap-transfer" onclick="switchDoc('rap-transfer')">На перевод</button>
</div>

<div class="page active" id="page-form">
  <div class="form-container">
    <h2 id="formTitle">Заполнение</h2>
    <div class="form-grid" id="formGrid"></div>
    <div class="photo-block">
      <h3>📎 Прикрепить фото</h3>
      <label class="photo-upload-btn" for="photoInput">＋ Выбрать файлы</label>
      <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(event)" style="display:none;">
      <div class="photo-preview-grid" id="photoGrid"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn-next" onclick="goToDoc()">📄 Перейти к документу →</button>
    <button class="btn-clear" onclick="clearForm()">🗑 Очистить</button>
  </div>
</div>

<div class="page" id="page-doc">
  <div class="doc-container">
    <div class="document" id="docPreview"></div>
  </div>
  <div class="actions">
    <button class="btn-back" onclick="goToForm()">← Назад к форме</button>
    <button class="btn-print" onclick="window.print()">🖨 Сохранить PDF</button>
    <button class="btn-discord" id="discordBtn" onclick="sendToDiscord()">🤖 Отправить в Discord</button>
  </div>
</div>

<!-- НОВАЯ СТРАНИЦА: Госзнак (скрытая) -->
<div class="page" id="page-gosznak">
  <div class="form-container">
    <h2>🏛️ Создание документов (Госзнак)</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label>Тип документа</label>
        <select id="gz-type" onchange="renderGosznakForm()">
          <option value="passport_full">Паспорт РФ (разворот с фото)</option>
          <option value="snils">СНИЛС</option>
        </select>
      </div>
    </div>
    <div id="gz-form-fields" class="form-grid" style="margin-top:15px;"></div>
    <div class="photo-block">
      <h3>📎 Прикрепить фото</h3>
      <label class="photo-upload-btn" for="gz-photoInput">＋ Выбрать файл</label>
      <input type="file" id="gz-photoInput" accept="image/*" onchange="handleGzPhoto(event)" style="display:none;">
      <div class="photo-preview-grid" id="gz-photoGrid"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn-next" onclick="generateGosznak()">📄 Сгенерировать документ</button>
    <button class="btn-clear" onclick="clearGosznak()">🗑 Очистить</button>
    <button class="btn-back" onclick="closeGosznak()">← Назад на сайт</button>
  </div>
</div>

<script>

const WEBHOOK_URL = "https://discord.com/api/webhooks/1560636556673552506/qkn1vrm5MoB-miSHONFaqqxU0YNtLe3xaQ0QpZDu08CnuqNJepDjEyWV1TYkXp7rQofG";

// ============================================================
// ДОКУМЕНТЫ (Основные)
// ============================================================
const DOCS = {
  const DOCS = {
  // ===== СУ =====
  'su-arrest': {
    title: 'Постановление о возбуждении уголовного дела', shortName: 'Возбуждение УД', dept: 'СУ',
    fields: [
      { id: 'place', label: 'Место составления', type: 'text' },
      { id: 'date', label: 'Дата', type: 'date' },
      { id: 'time', label: 'Время', type: 'time' },
      { id: 'officer', label: 'Следователь (должность, классный чин, ФИО)', type: 'text', full: true },
      { id: 'reason', label: 'Повод и основание (что рассмотрел)', type: 'textarea', full: true },

    ],
    render: (d) => `

    ],
    render: (d) => `
      <h2>П Р О Т О К О Л</h2>

  }
});

function openGosznak() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  renderGosznakForm();
}

function handleGzPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    gzPhoto = e.target.result;
    document.getElementById('gz-photoGrid').innerHTML = `
      <div class="photo-item">
        <img src="${gzPhoto}">
        <button class="remove" onclick="gzPhoto=null; document.getElementById('gz-photoGrid').innerHTML='';">×</button>
      </div>
    `;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function toggleMenu(e) {
  e.stopPropagation();
  document.getElementById('dropdown').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('dropdown');
  const btn = document.querySelector('.burger-btn');
  if (!dd.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
    dd.classList.remove('open');
  }
});

function switchDoc(id) {
  currentDoc = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-doc="${id}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('currentDocName').textContent = DOCS[id].shortName || DOCS[id].title;
  document.getElementById('dropdown').classList.remove('open');
  renderForm();
  renderPreview();
}

function goToDoc() {
  renderPreview();
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-doc').classList.add('active');
}
function goToForm() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-form').classList.add('active');
}

function renderForm() {
  const doc = DOCS[currentDoc];
  document.getElementById('formTitle').textContent = doc.title;
  const grid = document.getElementById('formGrid');
  grid.innerHTML = '';
  doc.fields.forEach(f => {
    const div = document.createElement('div');
    div.className = 'form-group' + (f.full ? ' full' : '');
    div.innerHTML = `
      <label>${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea id="f_${f.id}"></textarea>`
        : `<input type="${f.type}" id="f_${f.id}">`}
    `;
    grid.appendChild(div);
  });
  const saved = localStorage.getItem('doc_' + currentDoc);
  if (saved) {
    const data = JSON.parse(saved);
    doc.fields.forEach(f => {
      const el = document.getElementById('f_' + f.id);
      if (el && data[f.id]) el.value = data[f.id];
    });
  }
}

function renderPreview() {
  const doc = DOCS[currentDoc];
  const data = {};
  doc.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if (el) data[f.id] = el.value;
  });
  localStorage.setItem('doc_' + currentDoc, JSON.stringify(data));

  let html = doc.render(data);
  if (photos.length > 0) {
    html += `<div style="margin-top:30px; border-top:1px dashed #999; padding-top:15px;">
      <div class="section-title">Приложение: фотоматериалы</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">`;
    photos.forEach(p => {
      html += `<div style="border:1px solid #000; padding:5px;"><img src="${p}" style="width:100%; display:block;"></div>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('docPreview').innerHTML = html;
}

function clearForm() {
  if (!confirm('Очистить форму и фото?')) return;
  const doc = DOCS[currentDoc];
  doc.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if (el) el.value = '';
  });
  photos = [];
  renderPhotos();
  localStorage.removeItem('doc_' + currentDoc);
}

function handlePhotos(event) {
  const files = event.target.files;
  for (let i = 0; i < files.length; i++) {
    const reader = new FileReader();
    reader.onload = (e) => {
      photos.push(e.target.result);
      renderPhotos();
    };
    reader.readAsDataURL(files[i]);
  }
  event.target.value = '';
}

function renderPhotos() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '';
  photos.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="${src}"><button class="remove" onclick="removePhoto(${i})">×</button>`;
    grid.appendChild(div);
  });
}

function removePhoto(i) {
  photos.splice(i, 1);
  renderPhotos();
}

async function sendToDiscord() {
  const btn = document.getElementById('discordBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Генерация...';

  try {
    const element = document.getElementById('docPreview');

    btn.textContent = '⏳ Генерация PNG...';
    const canvas = await html2canvas(element, {
      scale: 2, useCORS: true, backgroundColor: '#ffffff'
    });
    const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

    btn.textContent = '⏳ Генерация PDF...';
    const pdfBlob = await html2pdf().from(element).set({
      margin: 10,
      filename: currentDoc + '.pdf',
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).outputPdf('blob');

    btn.textContent = '⏳ Отправка...';
    const formData = new FormData();
    
    let docName = 'document';
    let contentText = '';

    if (document.getElementById('page-gosznak').classList.contains('active')) {
      docName = 'gosznak_' + document.getElementById('gz-type').value;
      contentText = `🏛️ **Госзнак** — ${document.getElementById('gz-type').options[document.getElementById('gz-type').selectedIndex].text}\nОтправлено с сайта документооборота.`;
    } else {
      docName = DOCS[currentDoc].shortName;
      contentText = `📄 **${DOCS[currentDoc].dept}** — ${DOCS[currentDoc].title}\nОтправлено с сайта документооборота.`;
    }

    const pngName = docName + '.png';
    const pdfName = docName + '.pdf';
    formData.append('files[0]', pngBlob, pngName);
    formData.append('files[1]', pdfBlob, pdfName);

    formData.append('payload_json', JSON.stringify({
      content: contentText,
      username: 'МВД Документооборот',
      attachments: [
        { id: 0, filename: pngName },
        { id: 1, filename: pdfName }
      ]
    }));

    const response = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });

    if (response.ok) {
      btn.textContent = '✅ Отправлено!';
      setTimeout(() => {
        btn.textContent = '🤖 Отправить в Discord';
        btn.disabled = false;
      }, 2500);
    } else {
      const text = await response.text();
      throw new Error('HTTP ' + response.status + ': ' + text);
    }
  } catch (err) {
    alert('Ошибка отправки: ' + err.message);
    btn.textContent = '🤖 Отправить в Discord';
    btn.disabled = false;
  }
}
